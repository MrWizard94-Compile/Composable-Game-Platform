[package]
name = "wasmtime-host"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[[bin]]
name = "wasmtime-host"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
wasmtime = { version = "=50.0.3", features = ["component-model"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
