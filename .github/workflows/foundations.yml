name: foundations

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install development dependencies
        run: npm ci --no-fund --no-audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck host, browser runtime, packages, and console
        run: npx tsc -p tsconfig.foundations.json --noEmit
      - name: Verify shipped WebAssembly
        run: node --experimental-strip-types scripts/verify-wasm.ts
      - name: Check the third-party guest package
        run: node --experimental-strip-types scripts/check-wasm-module.ts examples/third-party-module
      - name: Check v1 Wasm and JavaScript release packages
        run: |
          node --experimental-strip-types scripts/check-module-package.ts examples/third-party-module
          node --experimental-strip-types scripts/check-module-package.ts examples/javascript-module
      - name: Build, stage, and validate JavaScript and Wasm releases
        run: |
          tmp="$(mktemp -d)"
          trap 'chmod -R u+w "$tmp"; rm -rf "$tmp"' EXIT
          node --experimental-strip-types scripts/build-module-package.ts --source examples/starter-module --release "$tmp/js-release" --stage "$tmp/js-stage"
          node --experimental-strip-types scripts/check-module-package.ts "$tmp/js-stage"
          node --experimental-strip-types scripts/build-module-package.ts --source examples/third-party-module --release "$tmp/wasm-release" --stage "$tmp/wasm-stage"
          node --experimental-strip-types scripts/check-module-package.ts "$tmp/wasm-stage"
          node --experimental-strip-types scripts/register-module-package.ts --staging "$tmp/js-stage" --store "$tmp/store"
          node --experimental-strip-types scripts/register-module-package.ts --staging "$tmp/wasm-stage" --store "$tmp/store"
          node --experimental-strip-types scripts/check-module-store.ts --store "$tmp/store"
      - name: Build and browser-test the CGP console
        run: npm run console:check
      - name: Foundations, browser isolation, composition, package store, and lockfile tests
        run: node --experimental-strip-types --test src/foundations/semver.test.ts src/foundations/host.test.ts src/foundations/dispatch.test.ts src/foundations/save.test.ts src/foundations/authoring.test.ts src/foundations/profile.test.ts src/foundations/isolation.test.ts src/foundations/browser-isolation.test.ts src/foundations/browser-wasm.test.ts src/foundations/stress.test.ts src/packages/package.test.ts src/packages/release-pipeline.test.ts src/packages/local-store.test.ts src/packages/project-lock.test.ts src/packages/activation-snapshot.test.ts src/packages/store-coordination.test.ts src/packages/store-retention.test.ts src/packages/wasm-activation.test.ts src/packages/project-activation.test.ts src/packages/package-resources.test.ts src/modules/composition.test.ts src/modules/sim.test.ts

  activation:
    name: activation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install development dependencies
        run: npm ci --no-fund --no-audit
      - name: Activation cleanup and package resource tests
        run: node --experimental-strip-types --test src/packages/project-activation.test.ts src/packages/package-resources.test.ts
